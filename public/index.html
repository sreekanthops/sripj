<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Diary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

<!-- ══ AUTH SCREEN ══════════════════════════════════════════════ -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-mark" style="font-size:32px">✦</span>
      <div class="logo-name" style="font-size:26px">Diary</div>
      <div class="logo-tagline">Your private space to write</div>
    </div>

    <!-- tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Sign In</button>
      <button class="auth-tab" data-tab="signup">Create Account</button>
    </div>

    <!-- login -->
    <div class="auth-panel" id="panelLogin">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="your username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPwd" placeholder="password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;justify-content:center">Sign In</button>
      <p id="loginErr" class="auth-err"></p>
    </div>

    <!-- signup -->
    <div class="auth-panel hidden" id="panelSignup">
      <div class="field">
        <label>Username <span class="auth-hint">(letters, numbers, _ — min 3)</span></label>
        <input type="text" id="signupUser" placeholder="choose a username" autocomplete="username">
      </div>
      <div class="field">
        <label>Display Name <span class="auth-hint">(shown to others)</span></label>
        <input type="text" id="signupName" placeholder="Your Name">
      </div>
      <div class="field">
        <label>Password <span class="auth-hint">(min 4 characters)</span></label>
        <input type="password" id="signupPwd" placeholder="choose a password" autocomplete="new-password">
      </div>
      <button class="btn btn-primary btn-lg" id="signupBtn" style="width:100%;justify-content:center">Create Account</button>
      <p id="signupErr" class="auth-err"></p>
    </div>
  </div>
</div>

<!-- ══ DIARY APP ════════════════════════════════════════════════ -->
<div id="appScreen" class="hidden">

  <!-- ── SIDEBAR ── -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">✦</span>
      <div>
        <div class="logo-name" id="sidebarTitle">My Diary</div>
        <div class="logo-tagline" id="sidebarSub">Personal Notes</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div id="headerActions"></div>
    </nav>

    <div id="musicBar">
      <div class="music-indicator" id="musicIndicator">
        <span class="music-dot"></span>
        <span class="music-dot"></span>
        <span class="music-dot"></span>
      </div>
      <span class="music-title" id="musicTitle">No music</span>
      <div class="music-controls">
        <button id="btnMPP" title="Play/Pause">▶</button>
        <button id="btnMute" title="Mute">♪</button>
        <input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.6">
      </div>
    </div>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <main id="mainContent">
    <div id="topbar">
      <div class="topbar-inner">
        <div class="page-title">
          <span class="page-title-text" id="pageTitle">Journal</span>
          <span id="noteCount" class="note-count"></span>
        </div>
        <div class="topbar-right">
          <div class="filter-group">
            <input type="date" class="date-input" id="filterFrom" title="From date">
            <span class="filter-sep">—</span>
            <input type="date" class="date-input" id="filterTo" title="To date">
            <button id="btnClearFilter" class="clear-btn">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <section id="notesSection">
      <p id="swipeHint"></p>
      <div id="notesGrid"></div>
    </section>
  </main>

</div>

<!-- ══ DETAIL MODAL ════════════════════════════════════════ -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal">
    <button class="modal-close" id="detailClose">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
    </button>
    <div id="detailContent"></div>
  </div>
</div>

<!-- ══ NOTE FORM MODAL ═════════════════════════════════════ -->
<div class="overlay center" id="formOverlay">
  <div class="modal" id="formModal">
    <button class="modal-close" id="formClose">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
    </button>
    <div class="modal-title" id="formTitle">New Entry</div>

    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="Give your entry a title…">
    </div>

    <div class="field">
      <label>Appearance</label>
      <div class="style-row">
        <select id="fFont">
          <option value="Georgia,serif">Georgia (Classic)</option>
          <option value="'Palatino Linotype',serif">Palatino</option>
          <option value="'Courier New',monospace">Courier</option>
          <option value="Arial,sans-serif">Arial</option>
          <option value="Verdana,sans-serif">Verdana</option>
          <option value="'Comic Sans MS',cursive">Comic Sans</option>
        </select>
        <input type="number" id="fSize" value="14" min="10" max="28" title="Font size px">
        <select id="fWeight">
          <option value="normal">Normal</option>
          <option value="bold">Bold</option>
          <option value="italic">Italic</option>
          <option value="bold italic">Bold+Italic</option>
        </select>
      </div>
      <label style="margin-bottom:6px">Colour Theme</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="field">
      <label>Content</label>
      <textarea id="fBody" class="lined" placeholder="Write your thoughts here…"></textarea>
    </div>

    <div class="field" id="musicField">
      <label>Background Music URL (.mp3)</label>
      <input type="text" id="fMusic" placeholder="https://…/song.mp3">
    </div>

    <div class="field" id="mediaField">
      <label>Photos &amp; Videos</label>
      <div class="exist-media-row" id="existMediaRow"></div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fFiles" accept="video/*,image/*" multiple>
        <span class="uz-icon">+</span>
        <div>Drag &amp; drop or <b>tap to choose</b></div>
        <small>MP4 · MOV · WebM · JPG · PNG · GIF · up to 200 MB</small>
      </div>
      <div class="upload-previews" id="uploadPreviews"></div>
    </div>

    <button class="btn btn-primary" id="fSave" style="width:100%;justify-content:center;margin-top:8px">
      Save Entry
    </button>
  </div>
</div>

<!-- ══ PROFILE MODAL ════════════════════════════════════════ -->
<div class="overlay center" id="profileOverlay">
  <div class="modal" id="profileModal">
    <button class="modal-close" id="profileClose">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
    </button>
    <div class="modal-title">Edit Profile</div>
    <div class="field">
      <label>Display Name</label>
      <input type="text" id="profName" placeholder="Your Name">
    </div>
    <div class="field">
      <label>Bio <span class="auth-hint">(optional, shown on your public page)</span></label>
      <textarea id="profBio" placeholder="Tell the world a little about yourself…" style="min-height:80px"></textarea>
    </div>
    <button class="btn btn-primary" id="profSave" style="width:100%;justify-content:center">Save</button>
  </div>
</div>

<div id="toast"></div>
<audio id="bgAudio" loop></audio>
<footer>My Diary v4.0</footer>

<script src="/js/app.js"></script>
</body>
</html>
