<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 72">
  <!-- stem -->
  <path d="M38,70 Q39,52 40,36 Q41,22 42,10" fill="none" stroke="#4a6832" stroke-width="2.4" stroke-linecap="round"/>
  <!-- side stem -->
  <path d="M39,50 Q30,44 24,36" fill="none" stroke="#4a6832" stroke-width="1.8" stroke-linecap="round"/>
  <!-- leaves -->
  <ellipse cx="20" cy="33" rx="10" ry="5" fill="#5a7840" transform="rotate(-38 20 33)" opacity="0.9"/>
  <ellipse cx="46" cy="42" rx="8"  ry="4" fill="#5a7840" transform="rotate(28 46 42)"  opacity="0.9"/>
  <!-- daisy 1 — main -->
  <g transform="translate(41,8) rotate(-5)">
    <ellipse rx="4.5" ry="8.5" fill="#edead e" transform="rotate(0)   translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edea de" transform="rotate(40)  translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(80)  translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(120) translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(160) translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(200) translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(240) translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(280) translate(0,-12)"/>
    <ellipse rx="4.5" ry="8.5" fill="#edeade" transform="rotate(320) translate(0,-12)"/>
    <circle r="6.5" fill="#d4a820"/>
    <circle r="4"   fill="#c89010"/>
  </g>
  <!-- daisy 2 — smaller, right -->
  <g transform="translate(62,22) rotate(8)">
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(0)   translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(45)  translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(90)  translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(135) translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(180) translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(225) translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(270) translate(0,-10)"/>
    <ellipse rx="3.5" ry="7"   fill="#f0ece2" transform="rotate(315) translate(0,-10)"/>
    <circle r="5"   fill="#c89010"/>
    <circle r="3"   fill="#b88008"/>
  </g>
</svg>
