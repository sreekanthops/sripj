  <!-- daisy stem group — pinned to bottom-right corner using % coords via transform -->
  <g transform="translate(660,590)" opacity="0.92">
    <!-- main stem -->
    <path d="M20,68 Q22,42 24,18 Q26,-4 28,-18" fill="none" stroke="#4a6832" stroke-width="2.8" stroke-linecap="round"/>
    <!-- side stem left -->
    <path d="M22,38 Q10,30 2,20"  fill="none" stroke="#4a6832" stroke-width="2.2" stroke-linecap="round"/>
    <!-- leaves -->
    <ellipse cx="-2"  cy="16"  rx="12" ry="6" fill="#5a7840" transform="rotate(-38 -2 16)"  opacity="0.9"/>
    <ellipse cx="34"  cy="26"  rx="10" ry="5" fill="#5a7840" transform="rotate(28 34 26)"   opacity="0.9"/>
    <ellipse cx="28"  cy="-6"  rx="9"  ry="4.5" fill="#5a7840" transform="rotate(20 28 -6)" opacity="0.85"/>
    <!-- Daisy 1 -->
    <g transform="translate(24,-20) rotate(-5)">
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(0)   translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(40)  translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(80)  translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(120) translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(160) translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(200) translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(240) translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(280) translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(320) translate(0,-14)"/>
      <circle r="8" fill="#d4a820"/>
      <circle r="5" fill="#c89810"/>
    </g>
    <!-- Daisy 2 -->
    <g transform="translate(56,-2) rotate(8)">
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(0)   translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(40)  translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(80)  translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(120) translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(160) translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(200) translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(240) translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(280) translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(320) translate(0,-15)"/>
      <circle r="9" fill="#c89010"/>
      <circle r="5.5" fill="#b88008"/>
    </g>
    <!-- Daisy 3 small -->
    <g transform="translate(0,10) rotate(-12)">
      <ellipse rx="4" ry="7.5" fill="#f2eee4" transform="rotate(0)   translate(0,-11)"/>
      <ellipse rx="4" ry="7.5" fill="#f2eee4" transform="rotate(60)  translate(0,-11)"/>
      <ellipse rx="4" ry="7.5" fill="#f2eee4" transform="rotate(120) translate(0,-11)"/>
