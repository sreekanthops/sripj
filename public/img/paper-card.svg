  <!-- daisy stem group -->
  <g opacity="0.92">
    <!-- main stem -->
    <path d="M678,648 Q680,620 682,592 Q685,570 688,556" fill="none" stroke="#4a6832" stroke-width="2.8" stroke-linecap="round"/>
    <!-- side stem left -->
