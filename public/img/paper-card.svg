      <ellipse rx="4" ry="7.5" fill="#f2eee4" transform="rotate(240) translate(0,-11)"/>
      <ellipse rx="4" ry="7.5" fill="#f2eee4" transform="rotate(300) translate(0,-11)"/>
      <circle r="5.5" fill="#c08808"/>
      <circle r="3"   fill="#a87000"/>
    </g>
