    <!-- leaf on main -->
    <ellipse cx="686" cy="574" rx="9" ry="4.5" fill="#5a7840" transform="rotate(20 686 574)" opacity="0.85"/>

    <!-- Daisy 1 — tallest, center -->
    <g transform="translate(683,546) rotate(-5)">
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(0)   translate(0,-14)"/>
      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(40)  translate(0,-14)"/>
