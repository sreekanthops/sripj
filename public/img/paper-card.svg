<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680">
  <defs>
    <filter id="t" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="4" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.65" numOctaves="3" seed="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f0e9dc" surfaceScale="1.5" result="light">
        <feDistantLight azimuth="45" elevation="70"/>
      </feDiffuseLighting>
      <feComposite in="light" in2="SourceGraphic" operator="multiply"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="50%" stop-color="#ede5d5"/>
      <stop offset="100%" stop-color="#e8e0ce"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="4" dy="5" stdDeviation="5" flood-color="#0003"/>
    </filter>
  </defs>

  <!-- transparent page bg -->

