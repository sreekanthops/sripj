      <ellipse rx="5.5" ry="10" fill="#ede8de" transform="rotate(320) translate(0,-14)"/>
      <circle r="8" fill="#d4a820"/>
      <circle r="5" fill="#c89810"/>
    </g>

    <!-- Daisy 2 — right, larger -->
    <g transform="translate(714,568) rotate(8)">
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(0)   translate(0,-15)"/>
      <ellipse rx="6" ry="11" fill="#f0ece2" transform="rotate(40)  translate(0,-15)"/>
