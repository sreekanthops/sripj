  />

  <!-- paper grain overlay applied only to the path shape -->
  <path filter="url(#paper)"
    fill="url(#bg)" opacity="0.35"
    d="
      M18,24
      C26,18 34,28 42,22 C50,16 58,26 66,20 C74,14 82,24 90,18
