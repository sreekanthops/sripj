<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" preserveAspectRatio="none">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.65" numOctaves="3" seed="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f0e9dc" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="45" elevation="70"/>
      </feDiffuseLighting>
      <feComposite in="light" in2="SourceGraphic" operator="multiply"/>
    </filter>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#0002"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f5f0e6"/>
      <stop offset="50%"  stop-color="#ede5d5"/>
      <stop offset="100%" stop-color="#e8e0ce"/>
    </linearGradient>
  </defs>

  <!--
    Torn top & bottom edges, straight left & right sides.
    Left edge:  x=18  (straight vertical)
    Right edge: x=782 (straight vertical)
    Top torn:   y oscillates around 24
    Bottom torn:y oscillates around 656
    This way vertical stretching (preserveAspectRatio=none) looks natural.
  -->
  <path filter="url(#shadow)" fill="url(#bg)"
    d="
      M18,24
      C26,18 34,28 42,22 C50,16 58,26 66,20 C74,14 82,24 90,18
      C98,12 106,22 114,16 C122,10 130,20 138,14 C146,8  154,18 162,12
      C170,6  178,16 186,10 C194,4  202,14 210,8  C218,2  226,12 234,6
      C242,0  250,10 258,4  C266,-2 274,8  282,2  C290,-4 298,6  306,0
      C314,-6 322,4  330,-2 C338,-8 346,2  354,-4 C362,-10 370,0 378,-6
      C386,-12 394,-2 402,-8 C410,-14 418,-4 426,-10 C434,-16 442,-6 450,-12
      C458,-18 466,-8 474,-14 C482,-20 490,-10 498,-16 C506,-22 514,-12 522,-18
      C530,-24 538,-14 546,-20 C554,-26 562,-16 570,-22 C578,-28 586,-18 594,-24
      C602,-30 610,-20 618,-26 C626,-32 634,-22 642,-28 C650,-34 658,-24 666,-30
      C674,-36 682,-26 690,-32 C698,-38 706,-28 714,-34 C722,-40 730,-30 738,-36
      C746,-42 754,-32 762,-38 C770,-44 778,-34 782,-30
      L782,650
      C774,656 766,646 758,652 C750,658 742,648 734,654 C726,660 718,650 710,656
      C702,662 694,652 686,658 C678,664 670,654 662,660 C654,666 646,656 638,662
      C630,668 622,658 614,664 C606,670 598,660 590,666 C582,672 574,662 566,668
      C558,674 550,664 542,670 C534,676 526,666 518,672 C510,678 502,668 494,674
      C486,680 478,670 470,676 C462,682 454,672 446,678 C438,684 430,674 422,680
      C414,686 406,676 398,682 C390,688 382,678 374,684 C366,690 358,680 350,686
      C342,692 334,682 326,688 C318,694 310,684 302,690 C294,696 286,686 278,692
      C270,698 262,688 254,694 C246,700 238,690 230,696 C222,702 214,692 206,698
      C198,704 190,694 182,700 C174,706 166,696 158,702 C150,708 142,698 134,704
      C126,710 118,700 110,706 C102,712 94,702 86,708 C78,714 70,704 62,710
      C54,716 46,706 38,712 C30,718 22,708 18,704
      Z
